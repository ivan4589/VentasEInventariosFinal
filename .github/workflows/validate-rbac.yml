# validation-revision: 5
name: Validate RBAC

on:
  push:
    branches:
      - agent/roles-permisos-alcance-datos
    paths:
      - '.github/workflows/validate-rbac.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-rbac-secret-not-used-at-runtime
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-rbac-encryption-key-not-used-at-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roles-permisos-alcance-datos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and record backend
        shell: bash
        run: |
          set +e
          LOG=.github/rbac-validation-result.txt
          mkdir -p .github
          : > "$LOG"
          run_step() {
            echo "" | tee -a "$LOG"
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            CODE=${PIPESTATUS[0]}
            echo "EXIT_CODE=$CODE" | tee -a "$LOG"
            return $CODE
          }

          STATUS=0
          run_step "npm ci" npm ci || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then run_step "prisma validate" npx prisma validate || STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then run_step "prisma generate" npx prisma generate || STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then run_step "npm run build" npm run build || STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then run_step "RBAC and auth tests" npm test -- --runInBand permissions.spec.ts auth || STATUS=$?; fi
          echo "" | tee -a "$LOG"
          echo "RBAC_BACKEND_FINAL_STATUS=$STATUS" | tee -a "$LOG"
          echo "Validated at $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          git commit -m "Registra detalle de validación RBAC"
          git push origin HEAD:agent/roles-permisos-alcance-datos
          exit "$STATUS"
