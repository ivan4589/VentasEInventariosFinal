name: Validate RBAC

on:
  push:
    branches:
      - agent/roles-permisos-alcance-datos
    paths:
      - '.github/workflows/validate-rbac.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-rbac-secret-not-used-at-runtime
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-rbac-encryption-key-not-used-at-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roles-permisos-alcance-datos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate backend
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci
          npx prisma validate
          npx prisma generate
          npm run build
          npm test -- --runInBand permissions.spec.ts auth
      - name: Record validation result
        shell: bash
        run: |
          mkdir -p .github
          {
            echo "RBAC_BACKEND_VALIDATION_OUTCOME=${{ steps.validation.outcome }}"
            echo "Validated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/rbac-validation-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rbac-validation-result.txt
          git commit -m "Registra validación de roles y permisos"
          git push origin HEAD:agent/roles-permisos-alcance-datos
          test "${{ steps.validation.outcome }}" = "success"
