name: Apply authentication security implementation

on:
  push:
    branches:
      - agent/autenticacion-segura-completa
    paths:
      - .github/workflows/apply-auth-security.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply generated files
        shell: bash
        run: |
          cat > /tmp/auth_impl.tar.gz.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/auth_impl.tar.gz.b64 > /tmp/auth_impl.tar.gz
          tar -xzf /tmp/auth_impl.tar.gz -C .

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git rm .github/workflows/apply-auth-security.yml
          git commit -m "Implementa autenticacion segura completa"
          git push origin HEAD:${GITHUB_REF_NAME}
