name: Run authentication security implementation

on:
  push:
    branches:
      - agent/autenticacion-segura-completa
    paths:
      - .github/workflows/run-auth-security.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract prepared implementation
        shell: bash
        run: |
          awk '/auth_impl.tar.gz.b64 <<.*PAYLOAD/{capture=1; next} capture && /^PAYLOAD$/{exit} capture{print}' .github/workflows/apply-auth-security.yml > /tmp/auth_impl.tar.gz.b64
          base64 --decode /tmp/auth_impl.tar.gz.b64 > /tmp/auth_impl.tar.gz
          tar -xzf /tmp/auth_impl.tar.gz -C .

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma
        run: npx prisma format && npx prisma validate && npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git rm -f .github/workflows/apply-auth-security.yml .github/workflows/run-auth-security.yml
          git commit -m "Implementa autenticación segura completa"
          git push origin HEAD:${GITHUB_REF_NAME}
