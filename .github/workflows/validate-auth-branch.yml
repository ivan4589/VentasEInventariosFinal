# validation-revision: 4
name: Validate backend auth branch

on:
  push:
    branches:
      - agent/cierre-autenticacion-segura
    paths:
      - '.github/workflows/validate-auth-branch.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-secret-not-used-at-runtime
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-encryption-key-not-used-at-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cierre-autenticacion-segura
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and record result
        shell: bash
        run: |
          set +e
          LOG=.github/backend-auth-validation-result.txt
          : > "$LOG"
          run_step() {
            echo "\n===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            CODE=${PIPESTATUS[0]}
            echo "EXIT_CODE=$CODE" | tee -a "$LOG"
            return $CODE
          }
          STATUS=0
          AUDIT_STATUS=0
          run_step "npm ci" npm ci || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then run_step "production audit" npm audit --omit=dev --audit-level=high || AUDIT_STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then run_step "prisma validate" npx prisma validate || STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then run_step "prisma generate" npx prisma generate || STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then run_step "npm run build" npm run build || STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then run_step "auth tests" npm test -- --runInBand auth || STATUS=$?; fi
          echo "\nPRODUCTION_AUDIT_STATUS=$AUDIT_STATUS" | tee -a "$LOG"
          echo "FINAL_STATUS=$STATUS" | tee -a "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          git commit -m "Registra validación de autenticación backend"
          git push origin HEAD:agent/cierre-autenticacion-segura
          exit 0
