name: Backend validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/auth-validation.yml'
  push:
    branches:
      - agent/roles-permisos-alcance-datos

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-validation-secret
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-validation-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --runInBand permissions.spec.ts auth
