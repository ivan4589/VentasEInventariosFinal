name: Backend validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/auth-validation.yml'
      - '.github/workflows/phase3-data-protection-implementation.yml'
      - '.github/workflows/phase3-reports-implementation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-validation-secret
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-validation-key-32-bytes!!
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Phase 3 foundation once
        run: |
          python <<'PY'
          from pathlib import Path

          target = Path('src/data-protection/data-protection.module.ts')
          if not target.exists():
              workflow = Path('.github/workflows/phase3-data-protection-implementation.yml').read_text(encoding='utf-8')
              marker_start = "          python <<'PY'\n"
              marker_end = "\n          PY\n"
              start = workflow.index(marker_start) + len(marker_start)
              end = workflow.index(marker_end, start)
              raw_script = workflow[start:end]
              script = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in raw_script.splitlines()
              )
              exec(compile(script, 'phase3_implementation.py', 'exec'))

          sales_path = Path('src/sales/sales.service.ts')
          sales = sales_path.read_text(encoding='utf-8')
          sales = sales.replace(
              "this.prisma.client.findFirst({\n        where: { id: clientId, isActive: true },\n      })",
              "this.prisma.client.findUnique({\n        where: { id: clientId },\n      })",
              1,
          )
          sales = sales.replace(
              "    if (!client) {\n      throw new NotFoundException(\n        'Cliente no encontrado o desactivado',",
              "    if (!client || client.isActive === false) {\n      throw new NotFoundException(\n        'Cliente no encontrado o desactivado',",
              1,
          )
          sales_path.write_text(sales, encoding='utf-8')
          PY
      - name: Apply Phase 3 reports protection once
        run: |
          python <<'PY'
          from pathlib import Path

          target = Path('src/reports/report-range.ts')
          if target.exists():
              print('Phase 3 reports protection already applied')
          else:
              workflow = Path('.github/workflows/phase3-reports-implementation.yml').read_text(encoding='utf-8')
              start_marker = '# PYTHON_BEGIN\n'
              end_marker = '\n# PYTHON_END'
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              raw = workflow[start:end]
              script_lines = []
              for line in raw.splitlines():
                  if line.startswith('# '):
                      script_lines.append(line[2:])
                  elif line == '#':
                      script_lines.append('')
                  else:
                      script_lines.append(line)
              script = '\n'.join(script_lines)
              exec(compile(script, 'phase3_reports.py', 'exec'))
          PY
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - name: Run security, reports and economic integrity tests
        run: |
          npm test -- --runInBand \
            src/auth/authorization/permissions.spec.ts \
            src/auth/security-crypto.spec.ts \
            src/auth/auth.service.spec.ts \
            src/auth/auth.controller.spec.ts \
            src/economic-integrity/economic-integrity.spec.ts \
            src/reports/report-range.spec.ts \
            src/payments/payments.service.spec.ts \
            src/warehouse-transfers/warehouse-transfers.service.spec.ts \
            src/sales/sales.service.spec.ts \
            src/sales/whatsapp.service.spec.ts \
            src/purchases/purchases.service.spec.ts \
            src/collections/collections.service.spec.ts \
            src/inventory/inventory.service.spec.ts
      - name: Production dependency audit
        run: npm audit --omit=dev || true
      - name: Commit Phase 3 implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add prisma src
          git commit -m "Protege reportes y enlaces de documentos en Fase 3"
          git push origin HEAD:${{ github.head_ref }}
