name: Backend validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/auth-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-validation-secret
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-validation-encryption-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/administracion-segura-usuarios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Correct status validations and lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/users/users.service.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '].includes(currentUser.status)',
              '].some((value) => value === currentUser.status)',
              1,
          )
          text = text.replace(
              '].includes(status)',
              '].some((value) => value === status)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- src/users/users.service.ts package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/users/users.service.ts package-lock.json
            git commit -m "Corrige validación de estados de usuario"
            git push origin HEAD:agent/administracion-segura-usuarios
          fi
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --runInBand permissions.spec.ts auth users
