name: Repair backend lockfile

on:
  push:
    branches:
      - agent/cierre-autenticacion-segura
    paths:
      - '.github/workflows/repair-lockfile.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cierre-autenticacion-segura
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya está sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sincroniza package-lock del backend"
          git push origin HEAD:agent/cierre-autenticacion-segura
