name: Implement Phase 3 data protection

on:
  push:
    branches:
      - agent/seguridad-datos-reportes-v1
    paths:
      - '.github/workflows/phase3-data-protection-implementation.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seguridad-datos-reportes-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Implement data protection foundation
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def write(path: str, content: str):
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content.strip() + '\n', encoding='utf-8')

          schema_path = Path('prisma/schema.prisma')
          schema = schema_path.read_text(encoding='utf-8')

          def replace_model(name: str, replacement: str):
              global schema
              pattern = rf'model {re.escape(name)} \{{.*?\n\}}'
              updated, count = re.subn(pattern, replacement.strip(), schema, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'No se pudo reemplazar el modelo {name}')
              schema = updated

          if 'dataAuditLogs' not in schema:
              schema = schema.replace(
                  '  economicAuditLogs            EconomicAuditLog[]',
                  '  economicAuditLogs            EconomicAuditLog[]\n  dataAuditLogs                DataAuditLog[]',
              )

          replace_model('Client', '''
          model Client {
            id              String     @id @default(cuid())
            fullName        String
            alias           String?
            type            ClientType @default(NORMAL)
            locationId      String
            location        Location   @relation(fields: [locationId], references: [id])
            phone           String?
            phoneNormalized String?
            whatsappConsent Boolean    @default(false)
            additionalInfo  String?
            isActive        Boolean    @default(true)
            deletedAt       DateTime?
            createdAt       DateTime   @default(now())
            updatedAt       DateTime   @updatedAt
            sales           Sale[]
            payments        Payment[]

            @@index([phoneNormalized])
            @@index([isActive])
            @@index([locationId, isActive])
            @@map("clients")
          }
          ''')

          replace_model('Provider', '''
          model Provider {
            id                    String             @id @default(cuid())
            companyName           String
            companyNameNormalized String
            contactName           String?
            phone                 String?
            phoneNormalized       String?
            email                 String?
            isActive              Boolean            @default(true)
            deletedAt             DateTime?
            products              Product[]
            purchaseGroups        PurchaseProvider[]
            createdAt             DateTime           @default(now())
            updatedAt             DateTime           @updatedAt

            @@index([phoneNormalized])
            @@index([companyNameNormalized])
            @@index([isActive])
            @@map("providers")
          }
          ''')

          replace_model('Product', '''
          model Product {
            id                   String                    @id @default(cuid())
            name                 String
            nameNormalized       String
            description          String?
            providerId           String
            provider             Provider                  @relation(fields: [providerId], references: [id])
            categoryId           String
            category             Category                  @relation(fields: [categoryId], references: [id])
            subCategoryId        String?
            subCategory          SubCategory?              @relation(fields: [subCategoryId], references: [id])
            weight               String?
            purchasePrice        Float
            priceNormal          Float
            priceCamino          Float
            priceEspecial        Float
            priceMayorista       Float?
            minQuantityWholesale Int?
            markupNormal         Float                     @default(10)
            markupCamino         Float                     @default(10)
            markupEspecial       Float                     @default(10)
            markupMayorista      Float                     @default(10)
            stock                Float                     @default(0)
            reservedStock        Float                     @default(0)
            minStock             Float                     @default(0)
            unit                 String                    @default("UNIDAD")
            reserveQuantity      Float                     @default(0)
            additionalInfo       String?
            imageUrl             String?
            isActive             Boolean                   @default(true)
            deletedAt            DateTime?
            purchaseDetails      PurchaseDetail[]
            saleDetails          SaleDetail[]
            saleReturnDetails    SaleReturnDetail[]
            warehouseStocks      WarehouseStock[]
            transferDetails      WarehouseTransferDetail[]
            inventoryMovements   InventoryMovement[]
            createdAt            DateTime                  @default(now())
            updatedAt            DateTime                  @updatedAt

            @@index([nameNormalized])
            @@index([isActive])
            @@index([providerId, isActive])
            @@index([categoryId, isActive])
          }
          ''')

          if 'model DataAuditLog' not in schema:
              schema = schema.replace(
                  'model ReportHistory {',
                  '''model DataAuditLog {
            id         String   @id @default(cuid())
            userId     Int
            action     String
            entityType String
            entityId   String
            reason     String?
            before     Json?
            after      Json?
            createdAt  DateTime @default(now())
            user       User     @relation(fields: [userId], references: [id], onDelete: Restrict)

            @@index([userId, createdAt])
            @@index([entityType, entityId])
            @@index([action, createdAt])
            @@map("data_audit_logs")
          }

          model ReportHistory {''',
              )

          schema_path.write_text(schema, encoding='utf-8')

          write('prisma/migrations/20260801033000_phase3_data_protection/migration.sql', r'''
          ALTER TABLE "clients"
            ADD COLUMN IF NOT EXISTS "phoneNormalized" TEXT,
            ADD COLUMN IF NOT EXISTS "isActive" BOOLEAN NOT NULL DEFAULT true,
            ADD COLUMN IF NOT EXISTS "deletedAt" TIMESTAMP(3);

          UPDATE "clients"
          SET "phoneNormalized" = CASE
            WHEN length(regexp_replace(COALESCE("phone", ''), '\D', '', 'g')) = 8
              THEN '591' || regexp_replace("phone", '\D', '', 'g')
            WHEN regexp_replace(COALESCE("phone", ''), '\D', '', 'g') <> ''
              THEN regexp_replace("phone", '\D', '', 'g')
            ELSE NULL
          END;

          WITH duplicated AS (
            SELECT "id", row_number() OVER (
              PARTITION BY "phoneNormalized" ORDER BY "createdAt", "id"
            ) AS position
            FROM "clients"
            WHERE "phoneNormalized" IS NOT NULL AND "isActive" = true
          )
          UPDATE "clients" AS client
          SET "phoneNormalized" = NULL
          FROM duplicated
          WHERE client."id" = duplicated."id" AND duplicated.position > 1;

          CREATE INDEX IF NOT EXISTS "clients_phoneNormalized_idx"
            ON "clients"("phoneNormalized");
          CREATE INDEX IF NOT EXISTS "clients_isActive_idx"
            ON "clients"("isActive");
          CREATE UNIQUE INDEX IF NOT EXISTS "clients_phoneNormalized_active_key"
            ON "clients"("phoneNormalized")
            WHERE "phoneNormalized" IS NOT NULL AND "isActive" = true;

          ALTER TABLE "providers"
            DROP CONSTRAINT IF EXISTS "providers_companyName_key";

          ALTER TABLE "providers"
            ADD COLUMN IF NOT EXISTS "companyNameNormalized" TEXT,
            ADD COLUMN IF NOT EXISTS "phoneNormalized" TEXT,
            ADD COLUMN IF NOT EXISTS "isActive" BOOLEAN NOT NULL DEFAULT true,
            ADD COLUMN IF NOT EXISTS "deletedAt" TIMESTAMP(3);

          UPDATE "providers"
          SET
            "companyNameNormalized" = lower(trim(regexp_replace("companyName", '\s+', ' ', 'g'))),
            "phoneNormalized" = CASE
              WHEN length(regexp_replace(COALESCE("phone", ''), '\D', '', 'g')) = 8
                THEN '591' || regexp_replace("phone", '\D', '', 'g')
              WHEN regexp_replace(COALESCE("phone", ''), '\D', '', 'g') <> ''
                THEN regexp_replace("phone", '\D', '', 'g')
              ELSE NULL
            END;

          ALTER TABLE "providers"
            ALTER COLUMN "companyNameNormalized" SET NOT NULL;

          WITH duplicated AS (
            SELECT "id", row_number() OVER (
              PARTITION BY "phoneNormalized" ORDER BY "createdAt", "id"
            ) AS position
            FROM "providers"
            WHERE "phoneNormalized" IS NOT NULL AND "isActive" = true
          )
          UPDATE "providers" AS provider
          SET "phoneNormalized" = NULL
          FROM duplicated
          WHERE provider."id" = duplicated."id" AND duplicated.position > 1;

          CREATE INDEX IF NOT EXISTS "providers_phoneNormalized_idx"
            ON "providers"("phoneNormalized");
          CREATE INDEX IF NOT EXISTS "providers_companyNameNormalized_idx"
            ON "providers"("companyNameNormalized");
          CREATE INDEX IF NOT EXISTS "providers_isActive_idx"
            ON "providers"("isActive");
          CREATE UNIQUE INDEX IF NOT EXISTS "providers_phoneNormalized_active_key"
            ON "providers"("phoneNormalized")
            WHERE "phoneNormalized" IS NOT NULL AND "isActive" = true;

          ALTER TABLE "Product"
            ADD COLUMN IF NOT EXISTS "nameNormalized" TEXT,
            ADD COLUMN IF NOT EXISTS "isActive" BOOLEAN NOT NULL DEFAULT true,
            ADD COLUMN IF NOT EXISTS "deletedAt" TIMESTAMP(3);

          UPDATE "Product"
          SET "nameNormalized" = lower(trim(regexp_replace("name", '\s+', ' ', 'g')));

          ALTER TABLE "Product"
            ALTER COLUMN "nameNormalized" SET NOT NULL;

          CREATE INDEX IF NOT EXISTS "Product_nameNormalized_idx"
            ON "Product"("nameNormalized");
          CREATE INDEX IF NOT EXISTS "Product_isActive_idx"
            ON "Product"("isActive");

          CREATE TABLE IF NOT EXISTS "data_audit_logs" (
            "id" TEXT NOT NULL,
            "userId" INTEGER NOT NULL,
            "action" TEXT NOT NULL,
            "entityType" TEXT NOT NULL,
            "entityId" TEXT NOT NULL,
            "reason" TEXT,
            "before" JSONB,
            "after" JSONB,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            CONSTRAINT "data_audit_logs_pkey" PRIMARY KEY ("id"),
            CONSTRAINT "data_audit_logs_userId_fkey"
              FOREIGN KEY ("userId") REFERENCES "User"("id")
              ON DELETE RESTRICT ON UPDATE CASCADE
          );

          CREATE INDEX IF NOT EXISTS "data_audit_logs_userId_createdAt_idx"
            ON "data_audit_logs"("userId", "createdAt");
          CREATE INDEX IF NOT EXISTS "data_audit_logs_entityType_entityId_idx"
            ON "data_audit_logs"("entityType", "entityId");
          CREATE INDEX IF NOT EXISTS "data_audit_logs_action_createdAt_idx"
            ON "data_audit_logs"("action", "createdAt");
          ''')

          write('src/data-protection/data-normalization.ts', r'''
          import { BadRequestException } from '@nestjs/common';

          export function normalizeDisplayText(value: string): string {
            return value.trim().replace(/\s+/g, ' ');
          }

          export function normalizeSearchText(value: string): string {
            return normalizeDisplayText(value)
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase();
          }

          export function normalizeOptionalText(
            value?: string | null,
          ): string | null {
            if (value === undefined || value === null) return null;
            const normalized = normalizeDisplayText(value);
            return normalized || null;
          }

          export function normalizeOptionalEmail(
            value?: string | null,
          ): string | null {
            const normalized = normalizeOptionalText(value);
            return normalized ? normalized.toLowerCase() : null;
          }

          export function normalizeOptionalPhone(
            value?: string | null,
          ): string | null {
            if (value === undefined || value === null || !value.trim()) {
              return null;
            }

            const digits = value.replace(/\D/g, '');
            const normalized = digits.length === 8 ? `591${digits}` : digits;

            if (normalized.length < 8 || normalized.length > 15) {
              throw new BadRequestException(
                'El teléfono debe tener entre 8 y 15 dígitos',
              );
            }

            return normalized;
          }

          export function requireChangeReason(
            value: string | undefined,
            action: string,
          ): string {
            const reason = normalizeOptionalText(value);
            if (!reason || reason.length < 10) {
              throw new BadRequestException(
                `Debes indicar un motivo de al menos 10 caracteres para ${action}`,
              );
            }
            if (reason.length > 500) {
              throw new BadRequestException(
                'El motivo no puede superar 500 caracteres',
              );
            }
            return reason;
          }
          ''')

          write('src/data-protection/data-audit.service.ts', r'''
          import { Injectable } from '@nestjs/common';
          import { Prisma } from '../../generated/prisma/client';
          import { PrismaService } from '../prisma/prisma.service';

          interface DataAuditInput {
            userId: number;
            action: string;
            entityType: string;
            entityId: string;
            reason?: string | null;
            before?: unknown;
            after?: unknown;
          }

          @Injectable()
          export class DataAuditService {
            constructor(private readonly prisma: PrismaService) {}

            private json(value: unknown): Prisma.InputJsonValue | undefined {
              if (value === undefined) return undefined;
              return JSON.parse(JSON.stringify(value)) as Prisma.InputJsonValue;
            }

            record(input: DataAuditInput, database: any = this.prisma) {
              return database.dataAuditLog.create({
                data: {
                  userId: input.userId,
                  action: input.action,
                  entityType: input.entityType,
                  entityId: input.entityId,
                  reason: input.reason || null,
                  before: this.json(input.before),
                  after: this.json(input.after),
                },
              });
            }
          }
          ''')

          write('src/data-protection/protected-documents.service.ts', r'''
          import {
            ForbiddenException,
            Injectable,
            NotFoundException,
          } from '@nestjs/common';
          import { access } from 'fs/promises';
          import * as path from 'path';
          import { $Enums } from '../../generated/prisma/client';
          import { PrismaService } from '../prisma/prisma.service';
          import { DataAuditService } from './data-audit.service';

          export interface DocumentActor {
            id: number;
            role: $Enums.Role;
          }

          export interface ProtectedDocumentDescriptor {
            filePath: string;
            downloadName: string;
            entityType: string;
            entityId: string;
          }

          @Injectable()
          export class ProtectedDocumentsService {
            constructor(
              private readonly prisma: PrismaService,
              private readonly audit: DataAuditService,
            ) {}

            private async descriptor(
              fileUrl: string | null | undefined,
              downloadName: string,
              entityType: string,
              entityId: string,
            ): Promise<ProtectedDocumentDescriptor> {
              if (!fileUrl) {
                throw new NotFoundException('El documento todavía no está disponible');
              }

              const relativePath = decodeURIComponent(fileUrl)
                .replace(/^https?:\/\/[^/]+/i, '')
                .replace(/^\/+/, '');
              const uploadsRoot = path.resolve(process.cwd(), 'uploads');
              const filePath = path.resolve(process.cwd(), relativePath);

              if (!filePath.startsWith(`${uploadsRoot}${path.sep}`)) {
                throw new ForbiddenException('La ruta del documento no es válida');
              }

              await access(filePath).catch(() => {
                throw new NotFoundException('El archivo no existe en el servidor');
              });

              return { filePath, downloadName, entityType, entityId };
            }

            async sale(
              saleId: string,
              cancelled: boolean,
            ): Promise<ProtectedDocumentDescriptor> {
              const sale = await this.prisma.sale.findUnique({
                where: { id: saleId },
                select: {
                  id: true,
                  saleNumber: true,
                  pdfUrl: true,
                  cancelledPdfUrl: true,
                },
              });
              if (!sale) throw new NotFoundException('Venta no encontrada');

              return this.descriptor(
                cancelled ? sale.cancelledPdfUrl : sale.pdfUrl,
                `${cancelled ? 'nota-venta-anulada' : 'nota-venta'}-${sale.saleNumber}.pdf`,
                'SALE_DOCUMENT',
                sale.id,
              );
            }

            async purchase(purchaseId: string) {
              const purchase = await this.prisma.purchase.findUnique({
                where: { id: purchaseId },
                select: { id: true, pdfUrl: true, date: true },
              });
              if (!purchase) throw new NotFoundException('Compra no encontrada');
              return this.descriptor(
                purchase.pdfUrl,
                `comprobante-compra-${purchase.id}.pdf`,
                'PURCHASE_DOCUMENT',
                purchase.id,
              );
            }

            async report(historyId: string, actor: DocumentActor) {
              const history = await this.prisma.reportHistory.findUnique({
                where: { id: historyId },
              });
              if (!history) {
                throw new NotFoundException('Historial de reporte no encontrado');
              }
              if (actor.role !== $Enums.Role.ADMIN && history.userId !== actor.id) {
                throw new ForbiddenException(
                  'No tienes permiso para descargar este reporte',
                );
              }
              return this.descriptor(
                history.fileUrl,
                `${history.title.replace(/[^a-zA-Z0-9-_áéíóúÁÉÍÓÚñÑ ]/g, '')}.pdf`,
                'REPORT_DOCUMENT',
                history.id,
              );
            }

            async recordDownload(
              actor: DocumentActor,
              descriptor: ProtectedDocumentDescriptor,
            ) {
              await this.audit.record({
                userId: actor.id,
                action: 'DOCUMENT_DOWNLOADED',
                entityType: descriptor.entityType,
                entityId: descriptor.entityId,
              });
            }
          }
          ''')

          write('src/data-protection/protected-documents.controller.ts', r'''
          import {
            Controller,
            Get,
            Param,
            Query,
            Request,
            Res,
            UseGuards,
          } from '@nestjs/common';
          import type { Response } from 'express';
          import { $Enums } from '../../generated/prisma/client';
          import { PERMISSIONS } from '../auth/authorization/permissions';
          import {
            AnyPermissions,
            Permissions,
          } from '../auth/decorators/permissions.decorator';
          import { Roles } from '../auth/decorators/roles.decorator';
          import { JwtAuthGuard } from '../auth/guards/jwt-auth.guard';
          import { RolesGuard } from '../auth/guards/roles.guard';
          import {
            ProtectedDocumentDescriptor,
            ProtectedDocumentsService,
          } from './protected-documents.service';

          @Controller('documents')
          @UseGuards(JwtAuthGuard, RolesGuard)
          export class ProtectedDocumentsController {
            constructor(private readonly documents: ProtectedDocumentsService) {}

            private async send(
              descriptor: ProtectedDocumentDescriptor,
              req: any,
              response: Response,
            ) {
              await this.documents.recordDownload(req.user, descriptor);
              response.setHeader('Cache-Control', 'no-store, private');
              response.setHeader('Pragma', 'no-cache');
              return response.download(
                descriptor.filePath,
                descriptor.downloadName,
              );
            }

            @Get('sales/:saleId')
            @Roles($Enums.Role.ADMIN, $Enums.Role.VENDEDOR)
            @Permissions(PERMISSIONS.SALES_DOWNLOAD_ALL)
            async sale(
              @Param('saleId') saleId: string,
              @Query('cancelled') cancelled: string | undefined,
              @Request() req: any,
              @Res() response: Response,
            ) {
              const descriptor = await this.documents.sale(
                saleId,
                cancelled === 'true',
              );
              return this.send(descriptor, req, response);
            }

            @Get('purchases/:purchaseId')
            @Roles($Enums.Role.ADMIN)
            @Permissions(PERMISSIONS.PURCHASES_VIEW)
            async purchase(
              @Param('purchaseId') purchaseId: string,
              @Request() req: any,
              @Res() response: Response,
            ) {
              const descriptor = await this.documents.purchase(purchaseId);
              return this.send(descriptor, req, response);
            }

            @Get('reports/:historyId')
            @Roles($Enums.Role.ADMIN, $Enums.Role.VENDEDOR, $Enums.Role.COBRADOR)
            @AnyPermissions(
              PERMISSIONS.REPORTS_HISTORY_ALL,
              PERMISSIONS.REPORTS_HISTORY_OWN,
            )
            async report(
              @Param('historyId') historyId: string,
              @Request() req: any,
              @Res() response: Response,
            ) {
              const descriptor = await this.documents.report(historyId, req.user);
              return this.send(descriptor, req, response);
            }
          }
          ''')

          write('src/data-protection/data-protection.module.ts', r'''
          import { Global, Module } from '@nestjs/common';
          import { AuthModule } from '../auth/auth.module';
          import { DataAuditService } from './data-audit.service';
          import { ProtectedDocumentsController } from './protected-documents.controller';
          import { ProtectedDocumentsService } from './protected-documents.service';

          @Global()
          @Module({
            imports: [AuthModule],
            controllers: [ProtectedDocumentsController],
            providers: [DataAuditService, ProtectedDocumentsService],
            exports: [DataAuditService, ProtectedDocumentsService],
          })
          export class DataProtectionModule {}
          ''')

          write('src/clients/dto/create-client.dto.ts', r'''
          import {
            IsBoolean,
            IsEnum,
            IsNotEmpty,
            IsOptional,
            IsString,
            MaxLength,
          } from 'class-validator';
          import { $Enums } from '../../../generated/prisma/client';

          export class CreateClientDto {
            @IsString()
            @IsNotEmpty()
            @MaxLength(160)
            fullName: string;

            @IsOptional()
            @IsString()
            @MaxLength(100)
            alias?: string;

            @IsEnum($Enums.ClientType)
            type: $Enums.ClientType;

            @IsString()
            @IsNotEmpty()
            locationId: string;

            @IsOptional()
            @IsString()
            @MaxLength(30)
            phone?: string;

            @IsOptional()
            @IsBoolean()
            whatsappConsent?: boolean;

            @IsOptional()
            @IsString()
            @MaxLength(500)
            additionalInfo?: string;
          }
          ''')

          write('src/clients/dto/update-client.dto.ts', r'''
          import { PartialType } from '@nestjs/mapped-types';
          import { CreateClientDto } from './create-client.dto';

          export class UpdateClientDto extends PartialType(CreateClientDto) {}
          ''')

          write('src/clients/dto/client-response.dto.ts', r'''
          import { $Enums } from '../../../generated/prisma/client';

          export class ClientResponseDto {
            id: string;
            fullName: string;
            alias?: string | null;
            type: $Enums.ClientType;
            locationId: string;
            locationName?: string;
            phone?: string | null;
            whatsappConsent: boolean;
            additionalInfo?: string | null;
            isActive: boolean;
            deletedAt?: Date | null;
            createdAt: Date;
            updatedAt: Date;
          }
          ''')

          write('src/clients/clients.service.ts', r'''
          import {
            ConflictException,
            Injectable,
            NotFoundException,
          } from '@nestjs/common';
          import { Prisma } from '../../generated/prisma/client';
          import { DataAuditService } from '../data-protection/data-audit.service';
          import {
            normalizeDisplayText,
            normalizeOptionalPhone,
            normalizeOptionalText,
          } from '../data-protection/data-normalization';
          import { PrismaService } from '../prisma/prisma.service';
          import { ClientResponseDto } from './dto/client-response.dto';
          import { CreateClientDto } from './dto/create-client.dto';
          import { UpdateClientDto } from './dto/update-client.dto';

          @Injectable()
          export class ClientsService {
            constructor(
              private readonly prisma: PrismaService,
              private readonly audit: DataAuditService,
            ) {}

            private include() {
              return { location: true } as const;
            }

            private toResponse(client: any): ClientResponseDto {
              return {
                id: client.id,
                fullName: client.fullName,
                alias: client.alias,
                type: client.type,
                locationId: client.locationId,
                locationName: client.location?.name,
                phone: client.phone,
                whatsappConsent: client.whatsappConsent,
                additionalInfo: client.additionalInfo,
                isActive: client.isActive,
                deletedAt: client.deletedAt,
                createdAt: client.createdAt,
                updatedAt: client.updatedAt,
              };
            }

            private async assertLocation(locationId: string, database: any = this.prisma) {
              const location = await database.location.findUnique({
                where: { id: locationId },
                select: { id: true },
              });
              if (!location) throw new NotFoundException('Localidad no encontrada');
            }

            private async assertPhoneAvailable(
              phoneNormalized: string | null,
              excludeId?: string,
              database: any = this.prisma,
            ) {
              if (!phoneNormalized) return;
              const duplicate = await database.client.findFirst({
                where: {
                  phoneNormalized,
                  isActive: true,
                  ...(excludeId ? { id: { not: excludeId } } : {}),
                },
                select: { id: true },
              });
              if (duplicate) {
                throw new ConflictException(
                  'Ya existe un cliente activo con el mismo teléfono',
                );
              }
            }

            async findAll(includeInactive = false): Promise<ClientResponseDto[]> {
              const clients = await this.prisma.client.findMany({
                where: includeInactive ? undefined : { isActive: true },
                include: this.include(),
                orderBy: [{ isActive: 'desc' }, { fullName: 'asc' }],
              });
              return clients.map((client) => this.toResponse(client));
            }

            async findOne(id: string, includeInactive = false) {
              const client = await this.prisma.client.findFirst({
                where: { id, ...(includeInactive ? {} : { isActive: true }) },
                include: this.include(),
              });
              if (!client) throw new NotFoundException('Cliente no encontrado');
              return this.toResponse(client);
            }

            async create(dto: CreateClientDto, actorId: number) {
              const phoneNormalized = normalizeOptionalPhone(dto.phone);
              try {
