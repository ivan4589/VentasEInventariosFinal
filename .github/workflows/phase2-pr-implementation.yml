name: Phase 2 implementation

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/phase2-pr-implementation.yml'
      - 'scripts/phase2/**'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-phase2-secret
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-phase2-encryption-key-32chars
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seguridad-integridad-economica-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair current dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply foundation
        run: |
          python3 scripts/phase2/foundation.py
          npx prisma format
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate foundation
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npm run build
      - name: Commit foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma src/economic-integrity src/inventory/dto package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Agrega base de integridad económica"
            git push origin HEAD:agent/seguridad-integridad-economica-v1
          fi
