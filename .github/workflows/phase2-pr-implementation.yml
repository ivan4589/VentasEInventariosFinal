name: Phase 2 implementation

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/phase2-pr-implementation.yml'
      - 'scripts/phase2/**'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-phase2-secret
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-phase2-encryption-key-32chars
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seguridad-integridad-economica-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and repair current dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply critical-operation hardening
        run: |
          python3 scripts/phase2/operations.py
          python3 scripts/phase2/fix_generated_operations.py
          npx prisma format
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate backend
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npm run build
          npm test -- --runInBand \
            src/economic-integrity/economic-integrity.spec.ts \
            src/payments/payments.service.spec.ts \
            src/warehouse-transfers/warehouse-transfers.service.spec.ts \
            src/sales/sales.service.spec.ts \
            src/sales/whatsapp.service.spec.ts \
            src/purchases/purchases.service.spec.ts \
            src/collections/collections.service.spec.ts \
            src/inventory/inventory.service.spec.ts
          npm audit --omit=dev || true
      - name: Commit validated implementation and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src prisma package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Completa integridad económica de operaciones críticas"
          fi
          git rm -f \
            .github/workflows/phase2-foundation.yml \
            .github/workflows/phase2-pr-implementation.yml \
            scripts/phase2/foundation.py \
            scripts/phase2/operations.py \
            scripts/phase2/fix_generated_operations.py
          git commit -m "Retira utilidades temporales de la fase 2"
          git push origin HEAD:agent/seguridad-integridad-economica-v1
