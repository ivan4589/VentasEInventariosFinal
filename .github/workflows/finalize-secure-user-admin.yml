# validation-revision: 3
name: Finalize secure user administration

on:
  push:
    branches:
      - agent/administracion-segura-usuarios
    paths:
      - '.github/workflows/finalize-secure-user-admin.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_ventas?schema=public
      JWT_SECRET: ci-only-user-admin-secret
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-user-admin-encryption-key-32chars
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/administracion-segura-usuarios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Complete authentication integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          auth = Path('src/auth/auth.service.ts')
          text = auth.read_text(encoding='utf-8')
          if '  mustChangePassword: boolean;' not in text:
              text = text.replace(
                  '  securityVersion: number;\n};',
                  '  securityVersion: number;\n  mustChangePassword: boolean;\n};',
                  1,
              )
          if '"mustChangePassword" = false' not in text:
              text = text.replace(
                  '            "securityVersion" = "securityVersion" + 1,\n            "failedLoginAttempts" = 0, "lockedUntil" = NULL, "updatedAt" = NOW()',
                  '            "securityVersion" = "securityVersion" + 1,\n            "mustChangePassword" = false,\n            "failedLoginAttempts" = 0, "lockedUntil" = NULL, "updatedAt" = NOW()',
                  1,
              )
          if '        mustChangePassword: user.mustChangePassword,' not in text:
              text = text.replace(
                  '        securityVersion: user.securityVersion,\n      },',
                  '        securityVersion: user.securityVersion,\n        mustChangePassword: user.mustChangePassword,\n      },',
                  1,
              )
          public_marker = '      twoFactorEnabled: user.twoFactorEnabled,\n      mustChangePassword: user.mustChangePassword,'
          if public_marker not in text:
              text = text.replace(
                  '      twoFactorEnabled: user.twoFactorEnabled,\n    };',
                  '      twoFactorEnabled: user.twoFactorEnabled,\n      mustChangePassword: user.mustChangePassword,\n    };',
                  1,
              )
          if 'Utiliza el módulo Administración de usuarios para restablecer el segundo factor' not in text:
              pattern = re.compile(
                  r"  async resetTwoFactorByAdmin\(userId: number, administratorId: number\) \{.*?\n  \}\n\n  private async createSession",
                  re.S,
              )
              replacement = '''  async resetTwoFactorByAdmin(_userId: number, _administratorId: number) {
    throw new BadRequestException(
      'Utiliza el módulo Administración de usuarios para restablecer el segundo factor con confirmación reforzada',
    );
  }

  private async createSession'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('No se pudo deshabilitar el endpoint heredado de 2FA')
          auth.write_text(text, encoding='utf-8')

          completion = Path('src/auth/auth-security-completion.service.ts')
          text = completion.read_text(encoding='utf-8')
          if '        mustChangePassword: boolean;' not in text:
              text = text.replace(
                  '        lastLoginAt: Date | null;\n      }>',
                  '        lastLoginAt: Date | null;\n        mustChangePassword: boolean;\n      }>',
                  1,
              )
          if '"lastLoginAt",\n             "mustChangePassword"' not in text:
              text = text.replace(
                  '             "twoFactorEnabled", "emailVerifiedAt", "lastLoginAt"\n',
                  '             "twoFactorEnabled", "emailVerifiedAt", "lastLoginAt",\n             "mustChangePassword"\n',
                  1,
              )
          change_password_block = '            "passwordChangedAt" = NOW(),\n            "mustChangePassword" = false,\n            "securityVersion" = "securityVersion" + 1,'
          if change_password_block not in text:
              text = text.replace(
                  '            "passwordChangedAt" = NOW(),\n            "securityVersion" = "securityVersion" + 1,',
                  change_password_block,
                  1,
              )
          completion.write_text(text, encoding='utf-8')
          PY
      - name: Repair lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate backend
        id: validate
        continue-on-error: true
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npm run build
          npm test -- --runInBand permissions.spec.ts auth users
      - name: Record and commit
        shell: bash
        run: |
          {
            echo "SECURE_USER_ADMIN_BACKEND=${{ steps.validate.outcome }}"
            echo "Validated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/secure-user-admin-backend.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth package-lock.json .github/secure-user-admin-backend.txt
          if ! git diff --cached --quiet; then
            git commit -m "Completa y valida administración segura"
            git push origin HEAD:agent/administracion-segura-usuarios
          fi
          test "${{ steps.validate.outcome }}" = "success"
